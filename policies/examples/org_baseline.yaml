apiVersion: custodian.dev/v1
kind: PolicyBundle
metadata:
  name: org-security-baseline
  version: "1.0.0"
  scope: ORG
defaults:
  effect: DENY
  onError: DENY
inspection:
  mandatory:
    - gitleaks
    - scancode
    - semgrep
  decisionModel:
    route: approved-code-review
    trigger:
      - restricted_ip_finding
      - high_risk_change
      - restricted_repository
rules:
  - id: org.secrets.block
    description: Non-overridable organization denial on critical secrets.
    stages: [INGRESS, EGRESS]
    when: findings.critical_secrets > 0
    effect: DENY
    overridable: false
  - id: org.licenses.prohibited
    description: Non-overridable organization denial on prohibited licenses.
    stages: [INGRESS, EGRESS]
    when: findings.prohibited_licenses > 0
    effect: DENY
    overridable: false
  - id: org.scan.incomplete
    description: Non-overridable quarantine when deterministic inspection is incomplete.
    stages: [INGRESS, EGRESS]
    when: "!findings.scan_complete"
    effect: QUARANTINE
    overridable: false
  - id: org.model.block
    description: Non-overridable organization denial when Stage B assessment disposition is BLOCK.
    stages: [EGRESS]
    when: assessment.disposition == "BLOCK"
    effect: DENY
    overridable: false
    message: Contextual decision model blocked publication.
  - id: org.model.indeterminate
    description: Non-overridable quarantine when Stage B assessment did not complete or disposition is INDETERMINATE.
    stages: [EGRESS]
    when: assessment.status != "COMPLETE" || assessment.disposition == "INDETERMINATE"
    effect: QUARANTINE
    overridable: false
    message: Contextual decision model assessment is incomplete or indeterminate.
  - id: org.vuln.remediation
    description: Require remediation when high-severity dependency vulnerabilities are present.
    stages: [EGRESS]
    when: findings.high_vulnerabilities > 0
    effect: REQUIRE_REMEDIATION
    overridable: false

apiVersion: custodian.dev/v1
kind: PolicyBundle
metadata:
  name: restricted-ip-repo
  version: "1.0.0"
  scope: REPO
defaults:
  effect: DENY
  onError: DENY
inspection:
  mandatory:
    - gitleaks
    - scancode
    - semgrep
    - ip_fingerprint
  decisionModel:
    route: restricted-ip-review
    trigger:
      - restricted_ip_finding
      - high_risk_change
      - restricted_repository
rules:
  - id: restricted.secrets.block
    stages: [INGRESS, EGRESS]
    when: findings.critical_secrets > 0
    effect: DENY
    overridable: false
  - id: restricted.licenses.block
    stages: [INGRESS, EGRESS]
    when: findings.prohibited_licenses > 0
    effect: DENY
    overridable: false
  - id: restricted.scan.incomplete
    stages: [INGRESS, EGRESS]
    when: "!findings.scan_complete"
    effect: QUARANTINE
    overridable: false
  - id: restricted.model.block
    stages: [EGRESS]
    when: assessment.disposition == "BLOCK"
    effect: DENY
    overridable: false
  - id: restricted.model.indeterminate
    stages: [EGRESS]
    when: assessment.status != "COMPLETE" || assessment.disposition == "INDETERMINATE"
    effect: QUARANTINE
    overridable: false
  - id: restricted.sast.remediation
    stages: [EGRESS]
    when: findings.high_sast_findings > 0
    effect: REQUIRE_REMEDIATION
  - id: restricted.ip.review
    description: All egress proposals in restricted IP repositories require ip-review sign-off.
    stages: [EGRESS]
    when: "true"
    effect: REQUIRE_APPROVAL
    obligations:
      - type: HUMAN_REVIEW
        reviewer_group: ip-review
        minimum: 1
  - id: restricted.ingress.allow
    stages: [INGRESS]
    when: >-
      findings.scan_complete &&
      findings.critical_secrets == 0 &&
      findings.prohibited_licenses == 0
    effect: ALLOW

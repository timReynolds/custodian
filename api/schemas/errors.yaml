ErrorDetail:
  type: object
  additionalProperties: false
  required:
    - code
    - message
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 128
    message:
      type: string
      minLength: 1
      maxLength: 512
    trace_id:
      type: ["string", "null"]
      maxLength: 64
    policy_decision_id:
      anyOf:
        - $ref: "./common.yaml#/UUIDv7"
        - type: "null"
    details:
      type: ["object", "null"]
      additionalProperties: true

ErrorResponse:
  type: object
  additionalProperties: false
  required:
    - error
  properties:
    error:
      $ref: "./errors.yaml#/ErrorDetail"

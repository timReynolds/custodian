name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: E2E tier to run
        required: false
        default: all
        type: choice
        options:
          - all
          - "1"
          - "2"
          - "3"
          - "4"
          - harness

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Build Binaries & Compute Shards
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: Build Custodian binaries
        run: make build

      - name: Verify E2E opaque-box isolation and compile-only build
        run: ./test/e2e/run_e2e.sh --compile-only --tier=all

      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@v7
        with:
          name: custodian-e2e-bins
          path: bin/
          retention-days: 1

      - name: Compute E2E shard matrix
        id: set-matrix
        env:
          SELECTED_TIER: ${{ inputs.tier || 'all' }}
        run: |
          MATRIX="$(jq -nc --arg selected "$SELECTED_TIER" '
            [
              {"name":"harness","tier":"harness","mode":"harness","tier_arg":"","pattern":""},
              {"name":"tier1-custody","tier":"1","mode":"regex","tier_arg":"","pattern":"^TestT1_F0[1-6]_"},
              {"name":"tier1-ingress-egress","tier":"1","mode":"regex","tier_arg":"","pattern":"^TestT1_F(0[7-9]|1[0-2])_"},
              {"name":"tier1-pipeline-ops","tier":"1","mode":"regex","tier_arg":"","pattern":"^TestT1_F(1[3-9]|20)_"},
              {"name":"tier2-custody","tier":"2","mode":"regex","tier_arg":"","pattern":"^TestT2_F0[1-6]_"},
              {"name":"tier2-ingress-egress","tier":"2","mode":"regex","tier_arg":"","pattern":"^TestT2_F(0[7-9]|1[0-2])_"},
              {"name":"tier2-pipeline-ops","tier":"2","mode":"regex","tier_arg":"","pattern":"^TestT2_F(1[3-9]|20)_"},
              {"name":"tier3-pairwise","tier":"3","mode":"tier","tier_arg":"3","pattern":""},
              {"name":"tier4-scenarios","tier":"4","mode":"tier","tier_arg":"4","pattern":""}
            ]
            | [.[] | select($selected == "all" or .tier == $selected)]
          ')"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.name }})
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: custodian-e2e-bins
          path: bin

      - name: Restore binary executable permissions
        run: chmod +x bin/*

      - name: Pre-pull postgres:17-alpine image
        run: docker pull postgres:17-alpine

      - name: Run E2E shard
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
          CUSTODIAN_E2E_BIN_DIR: ${{ github.workspace }}/bin
          CUSTODIAN_E2E_ROOT: ${{ github.workspace }}
          SHARD_MODE: ${{ matrix.mode }}
          SHARD_TIER_ARG: ${{ matrix.tier_arg }}
          SHARD_PATTERN: ${{ matrix.pattern }}
        run: |
          case "$SHARD_MODE" in
            harness)
              ./test/e2e/run_e2e.sh --harness-only
              ;;
            tier)
              ./test/e2e/run_e2e.sh --tier="$SHARD_TIER_ARG"
              ;;
            regex)
              go test -count=1 -timeout=25m -v -run "$SHARD_PATTERN" ./test/e2e
              ;;
            *)
              echo "error: unknown SHARD_MODE '$SHARD_MODE'" >&2
              exit 1
              ;;
          esac
